<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="favicon-16x16.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDPAbarber</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0B0B0B;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }

    /* ── Scissor particles background ── */
    .bg-pattern {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(184,150,46,0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(184,150,46,0.04) 0%, transparent 50%);
      pointer-events: none;
    }

    /* ── Center container ── */
    .splash-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.7s ease forwards 0.2s;
    }

    /* ── Scissors icon ── */
    .splash-icon {
      width: 72px;
      height: 72px;
      margin-bottom: 20px;
      opacity: 0;
      animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards 0.4s;
    }

    /* ── Logo text ── */
    .splash-logo {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #ffffff;
      line-height: 1;
      margin-bottom: 4px;
    }
    .splash-logo em {
      font-style: normal;
      color: #B8962E;
    }
    .splash-logo .dot {
      color: #B8962E;
    }

    /* ── Tagline ── */
    .splash-tag {
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 32px;
    }

    /* ── Gold divider ── */
    .splash-divider {
      width: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, #B8962E, transparent);
      margin-bottom: 32px;
      animation: expandLine 0.8s ease forwards 0.9s;
    }

    /* ── Loading dots ── */
    .splash-dots {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .dot-item {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #B8962E;
      opacity: 0.3;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .dot-item:nth-child(2) { animation-delay: 0.2s; }
    .dot-item:nth-child(3) { animation-delay: 0.4s; }

    /* ── Bottom credit ── */
    .splash-credit {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #333;
      opacity: 0;
      animation: fadeIn 0.5s ease forwards 1.2s;
      white-space: nowrap;
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.5) rotate(-20deg); }
      to   { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes expandLine {
      to { width: 120px; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.4); }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

    body.leaving {
      animation: fadeOut 0.5s ease forwards;
    }
  </style>
</head>
<body>

<div class="bg-pattern"></div>

<div class="splash-wrap">

  <!-- Scissors SVG icon -->
  <svg class="splash-icon" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Scissor blade 1 -->
    <circle cx="16" cy="56" r="9" stroke="#B8962E" stroke-width="2.5" fill="none"/>
    <circle cx="16" cy="56" r="3.5" fill="#B8962E" opacity="0.6"/>
    <!-- Scissor blade 2 -->
    <circle cx="16" cy="16" r="9" stroke="#B8962E" stroke-width="2.5" fill="none"/>
    <circle cx="16" cy="16" r="3.5" fill="#B8962E" opacity="0.6"/>
    <!-- Blade lines -->
    <line x1="23" y1="50" x2="60" y2="26" stroke="#B8962E" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="23" y1="22" x2="60" y2="46" stroke="#666" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Pivot -->
    <circle cx="36" cy="36" r="3" fill="#B8962E"/>
  </svg>

  <!-- Brand name -->
  <div class="splash-logo">
    <span>EDPA</span><em>barber</em><span class="dot">.</span>
  </div>

  <!-- Tagline -->
  <div class="splash-tag">Professional Barbershop</div>

  <!-- Gold line -->
  <div class="splash-divider"></div>

  <!-- Loading dots -->
  <div class="splash-dots">
    <div class="dot-item"></div>
    <div class="dot-item"></div>
    <div class="dot-item"></div>
  </div>

</div>

<div class="splash-credit">Est. 2024 · EDPAbarber</div>

<script>
  // Redirect ke index.html setelah 2.8 detik
  setTimeout(function() {
    document.body.classList.add('leaving');
    setTimeout(function() {
      window.location.replace('index.html');
    }, 500);
  }, 2800);
</script>

</body>
</html>
