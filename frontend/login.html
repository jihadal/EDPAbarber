<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='12' fill='%23111'/><text y='.9em' font-size='72' font-family='Georgia,serif' font-weight='bold' fill='%23C9A84C' x='50%25' text-anchor='middle' dominant-baseline='hanging' dy='10'>E</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — EDPAbarber</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<header class="site-header">
  <div class="nav-inner">
    <a class="brand" href="index.html"><span>EDPA</span><em>barber</em><span class="dot">.</span></a>
    <button class="menu-toggle" onclick="document.querySelector('.nav').classList.toggle('open')">☰</button>
    <ul class="nav">
      <li><a href="index.html">Home</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="barbers.html">Barbers</a></li>
      <li><a href="login.html" class="active">Login</a></li>
    </ul>
    <div class="nav-actions">
      <a class="btn btn-gold" href="booking.html">BOOK NOW ↗</a>
    </div>
  </div>
</header>

<!-- AUTH LAYOUT -->
<div class="auth-wrap">

  <!-- Left photo panel -->
  <div class="auth-photo">
    <div class="auth-photo-overlay"></div>
    <div class="auth-photo-text">
      <div class="auth-brand-tag">EDPA BARBER CLUB</div>
      <div class="auth-headline">GOOD STYLE<em>IS A HABIT.</em></div>
    </div>
  </div>

  <!-- Right form panel -->
  <div class="auth-form-side">

    <!-- LOGIN FORM -->
    <div id="loginSection">
      <div class="eyebrow-line" style="margin-bottom:14px">WELCOME BACK</div>
      <h1 class="auth-title">Login<span class="dot">.</span></h1>
      <p class="auth-desc">Masuk ke dashboard EDPAbarber.</p>

      <div class="tab-row" id="roleTab">
        <button class="tab-btn active" id="tabCustomer" onclick="switchRole('customer')">CUSTOMER</button>
        <button class="tab-btn" id="tabAdmin" onclick="switchRole('admin')">ADMIN</button>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input id="loginEmail" type="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input id="loginPassword" type="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-gold full btn-lg">LOGIN TO DASHBOARD ↗</button>
        <p id="loginMsg" class="form-message"></p>
      </form>

      <div class="auth-divider">NEW TO EDPAbarber?</div>
      <button class="btn btn-outline full" onclick="showSection('registerSection')">CREATE ACCOUNT</button>

      <p style="font-size:11px;color:var(--muted);margin-top:20px;text-align:center">
        Demo: <strong style="color:var(--gold)">customer@edpabarber.com</strong> / <strong style="color:var(--gold)">Customer123!</strong>
      </p>
    </div>

    <!-- REGISTER FORM -->
    <div id="registerSection" class="hidden">
      <div class="eyebrow-line" style="margin-bottom:14px">JOIN US</div>
      <h1 class="auth-title">Register<span class="dot">.</span></h1>
      <p class="auth-desc">Buat akun customer EDPAbarber.</p>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label">Nama Lengkap</label>
          <input id="regName" type="text" class="form-input" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input id="regEmail" type="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input id="regPassword" type="password" class="form-input" placeholder="Min. 8 characters" minlength="8" required autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="form-label">No. WhatsApp</label>
          <input id="regPhone" type="tel" class="form-input" placeholder="081234567890" required>
        </div>
        <div class="form-group">
          <label class="form-label">Alamat (opsional)</label>
          <textarea id="regAddress" class="form-textarea" placeholder="Alamat lengkap..." rows="2"></textarea>
        </div>
        <button type="submit" class="btn btn-gold full btn-lg">REGISTER ↗</button>
        <p id="registerMsg" class="form-message"></p>
      </form>

      <div class="auth-divider">ALREADY A MEMBER?</div>
      <button class="btn btn-outline full" onclick="showSection('loginSection')">BACK TO LOGIN</button>
    </div>

  </div>
</div>

<script>
  let selectedRole = 'customer';
  function switchRole(r) {
    selectedRole = r;
    document.getElementById('tabCustomer').classList.toggle('active', r === 'customer');
    document.getElementById('tabAdmin').classList.toggle('active', r === 'admin');
  }
  function showSection(id) {
    document.getElementById('loginSection').classList.add('hidden');
    document.getElementById('registerSection').classList.add('hidden');
    document.getElementById(id).classList.remove('hidden');
  }
</script>
<script src="script.js"></script>
</body>
</html>
